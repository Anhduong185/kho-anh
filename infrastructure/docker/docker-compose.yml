services:
  postgres:
    image: postgres:16-alpine
    container_name: smb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smb
      POSTGRES_PASSWORD: smb_dev_password
      POSTGRES_DB: secure_media_backup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smb -d secure_media_backup"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: smb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    container_name: smb-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin_dev_password;
      mc mb --ignore-existing local/smb-copy1-primary;
      mc mb --ignore-existing local/smb-copy2-secondary;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
